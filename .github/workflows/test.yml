name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Node dependencies
        run: npm install

      - name: Ruff lint check
        run: ruff check agent/ server/ tests/

      - name: Ruff format check
        run: ruff format --check agent/ server/ tests/

      - name: Run Python tests
        run: pytest tests/ -x -q --ignore=tests/test_e2e.py

      - name: Run PCB viewer JS regression tests
        run: node tests/test_pcb_viewer.js

      - name: Run schematic renderer JS regression tests
        run: node tests/test_schematic_renderer.js

      - name: Run session URL helper regression tests
        run: node tests/test_session_url_helper.js
