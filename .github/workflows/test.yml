name: test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements.txt
      - run: python tests/test_fixes.py
      - run: python tests/test_nets.py
      - run: python tests/test_pin_extraction.py
      - run: python tests/test_batched_netlist.py
      - run: python tests/test_routing_export.py
