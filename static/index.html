<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CircuitBot EDA</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="eda-app">
        <!-- Top Menubar & Toolbar -->
        <header class="eda-header">
            <div class="brand">
                <span class="logo">⚡</span>
                <span class="title">CircuitBot <span class="version">v0.8.2</span></span>
            </div>
            <div class="toolbar">
                <button id="addBtn" class="tool-btn" title="Add Selected Component to Schematic" disabled>
                    <span class="icon">+</span> Add Component
                </button>
                <div class="divider"></div>
                <button id="exportSchBtn" class="tool-btn highlight" title="Export as KiCad .kicad_sch" disabled>
                    <span class="icon">⤓</span> Export .kicad_sch
                </button>
                <button id="exportPCBBtn" class="tool-btn highlight" title="Export as KiCad .kicad_pcb" disabled>
                    <span class="icon">⤓</span> Export .kicad_pcb
                </button>
                <button id="importPCBBtn" class="tool-btn" title="Import .kicad_pcb file" disabled>
                    <span class="icon">📂</span> Import PCB
                </button>
            </div>
        </header>

        <div class="eda-workspace">
            <!-- Left Sidebar: Library & Hierarchy -->
            <aside class="eda-sidebar left-panel">
                <div class="panel-section netlist-section">
                    <div class="panel-header">
                        <span class="panel-title">Netlist</span>
                        <button id="copyNetlistBtn" class="icon-btn" title="Copy netlist to clipboard">📋</button>
                        <span id="netlistCount" class="badge">0</span>
                    </div>
                    <div id="netlistDisplay" class="netlist-content">
                        <div class="netlist-placeholder">Waiting for agent to generate netlist...</div>
                    </div>
                </div>
                
                <div class="panel-divider horizontal"></div>
                
                <div class="panel-section hierarchy-section">
                    <div class="panel-header">
                        <span class="panel-title">Placed Components</span>
                        <span id="compCount" class="badge">0</span>
                    </div>
                    <ul id="componentList" class="list-view">
                        <!-- Placed items populated by app.js -->
                    </ul>
                </div>
            </aside>

            <!-- Center: Workspace Canvas -->
            <main class="eda-main">
                <div class="canvas-header">
                    <div class="tabs">
                        <button id="viewSchematicBtn" class="tab active">Schematic Editor</button>
                        <button id="viewPCBBtn" class="tab">PCB View</button>
                        <button id="viewSymbolBtn" class="tab">Symbol Preview</button>
                    </div>
                    <div class="canvas-controls">
                        <div class="zoom-group">
                            <button id="zoomOutBtn" title="Zoom Out">-</button>
                            <span id="zoomLevel">100%</span>
                            <button id="zoomInBtn" title="Zoom In">+</button>
                            <button id="zoomResetBtn" title="Fit to View">Fit</button>
                        </div>
                    </div>
                </div>
                
                <div class="canvas-viewport">
                    <div id="canvasContainer"></div>
                    <canvas id="pcbCanvas" style="display:none"></canvas>
                    <canvas id="symbolCanvas" style="display:none"></canvas>
                    <div id="tscircuit-container" style="display:none;width:100%;height:100%"></div>
                    <div id="modeIndicator" class="mode-indicator hidden">SCHEMATIC</div>
                    <div id="completenessBadge" class="completeness-badge hidden"></div>
                    
                    <!-- PCB Upload Overlay (hidden by default, shown in PCB View tab) -->
                    <div id="pcbUploadArea" class="pcb-upload-overlay hidden">
                        <div class="pcb-upload-content">
                            <div class="pcb-upload-icon">📋</div>
                            <p>Drop a <code>.kicad_pcb</code> file here</p>
                            <p class="pcb-upload-sub">or click to browse</p>
                            <input type="file" id="pcbFileInput" accept=".kicad_pcb" hidden>
                        </div>
                    </div>

                    <!-- Contextual Route Input (Floating at bottom of canvas) -->
                    <div class="floating-route-input">
                        <input type="text" id="routePrompt" placeholder="Routing constraints (e.g. 'connect VCC to 3.3V')..." autocomplete="off">
                    </div>
                </div>

                <footer class="eda-status-bar">
                    <div class="status-left">
                        <span class="status-item">Grid: 1.27mm</span>
                        <span class="status-item" id="coordDisplay">X: 0.00 Y: 0.00</span>
                    </div>
                    <div class="status-right">
                    </div>
                </footer>
            </main>

            <!-- Right Sidebar: AI Design Co-Pilot -->
            <aside class="eda-sidebar right-panel">
                <div class="panel-section agent-section">
                    <div class="panel-header">
                        <span class="panel-title">AI Design Co-Pilot</span>
                    </div>
                    <div class="agent-workspace">
                        <!-- Thinking bar — thin line indicator -->
                        <div class="agent-thinking-bar" id="agentThinkingBar"></div>
                        <!-- Compact status bar -->
                        <div class="agent-status-bar">
                            <span class="agent-status-text" id="agentStatus">Ready</span>
                        </div>
                        <!-- Activity stream -->
                        <div class="agent-conversation" id="agentConversation">
                            <div class="conv-empty">Describe a circuit and I'll design it for you.</div>
                        </div>
                        <!-- Command input -->
                        <div class="agent-input-group">
                            <textarea id="agentPrompt" placeholder="Describe a circuit..." rows="1"></textarea>
                            <button id="agentBtn" class="btn-send" disabled>Build</button>
                        </div>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.4.2/pixi.min.js"></script>
    <script src="/static/schematic.js?v=12"></script>
    <script src="/static/renderer_legacy.js?v=10"></script>
    <script src="/static/schematic_renderer.js?v=2"></script>
    <script src="/static/pcb_viewer.js?v=1"></script>
    <script src="/static/tscircuit-bridge.js?v=1"></script>
    <script src="/static/app.js?v=13"></script>
</body>
</html>
