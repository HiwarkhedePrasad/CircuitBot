<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CircuitBot EDA</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <!-- SVG sprite for avatars -->
    <svg style="display:none">
        <symbol id="icon-bot" viewBox="0 0 24 24">
            <rect x="5" y="5" width="14" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/>
            <circle cx="12" cy="12" r="2.5" fill="currentColor" opacity="0.5"/>
            <line x1="9" y1="3" x2="9" y2="5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="12" y1="3" x2="12" y2="5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="15" y1="3" x2="15" y2="5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="9" y1="21" x2="9" y2="19" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="12" y1="21" x2="12" y2="19" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="15" y1="21" x2="15" y2="19" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="3" y1="9" x2="5" y2="9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="3" y1="12" x2="5" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="3" y1="15" x2="5" y2="15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="21" y1="9" x2="19" y2="9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="21" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="21" y1="15" x2="19" y2="15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </symbol>
    </svg>
    <div class="eda-app">
        <!-- Top Menubar & Toolbar -->
        <header class="eda-header">
            <div class="brand">
                <span class="logo">⚡</span>
                <span class="title">CircuitBot <span class="version">v0.8.2</span></span>
                <span class="connection-status" id="connectionStatus" title="Connected to backend">●</span>
            </div>
            <div class="toolbar">
                <button id="addBtn" class="tool-btn" title="Add Selected Component to Schematic" disabled>
                    <span class="icon">+</span> Add Component
                </button>
                <div class="divider"></div>
                <button id="exportSchBtn" class="tool-btn highlight" title="Export as KiCad .kicad_sch" disabled>
                    <span class="icon">⤓</span> Export .kicad_sch
                </button>
                <button id="exportPCBBtn" class="tool-btn highlight" title="Export as KiCad .kicad_pcb" disabled>
                    <span class="icon">⤓</span> Export .kicad_pcb
                </button>
                <button id="importPCBBtn" class="tool-btn" title="Import .kicad_pcb file" disabled>
                    <span class="icon">📂</span> Import PCB
                </button>
            </div>
        </header>

        <div class="eda-workspace">
            <!-- Left Sidebar: Library & Hierarchy -->
            <aside class="eda-sidebar left-panel" id="leftPanel">
                <button class="sidebar-toggle left-toggle" id="leftToggle" title="Collapse panel">
                    <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                        <polyline points="8,2 4,6 8,10"/>
                    </svg>
                </button>
                <div class="panel-section netlist-section">
                    <div class="panel-header">
                        <span class="panel-title">Netlist</span>
                        <button id="copyNetlistBtn" class="icon-btn" title="Copy netlist to clipboard">📋</button>
                        <span id="netlistCount" class="badge">0</span>
                    </div>
                    <div id="netlistDisplay" class="netlist-content">
                        <div class="netlist-placeholder">Waiting for agent to generate netlist...</div>
                    </div>
                </div>
                
                <div class="panel-divider horizontal"></div>
                
                <div class="panel-section hierarchy-section">
                    <div class="panel-header">
                        <span class="panel-title">Placed Components</span>
                        <span id="compCount" class="badge">0</span>
                    </div>
                    <ul id="componentList" class="list-view">
                        <!-- Placed items populated by app.js -->
                    </ul>
                </div>
                <div id="pcbLayersPanel" class="panel-section pcb-layers-section hidden">
                    <div class="panel-header">
                        <span class="panel-title">PCB Layers</span>
                    </div>
                    <div id="pcbLayersList" class="pcb-layers-list"></div>
                </div>
            </aside>

            <div class="resize-handle" id="leftResize"></div>
            <div class="collapse-strip left-expand" id="leftExpand" style="display:none" title="Expand left panel">
                <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                    <polyline points="5,3 9,7 5,11"/>
                </svg>
            </div>

            <!-- Center: Workspace Canvas -->
            <main class="eda-main">
                <div class="canvas-header">
                    <div class="canvas-header-row">
                        <div class="tabs">
                            <button id="viewSchematicBtn" class="tab active">Schematic Editor</button>
                            <button id="viewPCBBtn" class="tab">PCB View</button>
                            <button id="viewSymbolBtn" class="tab">Symbol Preview</button>
                        </div>
                        <div class="canvas-controls">
                            <div class="zoom-group">
                                <button id="zoomOutBtn" title="Zoom Out">-</button>
                                <span id="zoomLevel">100%</span>
                                <button id="zoomInBtn" title="Zoom In">+</button>
                                <button id="zoomResetBtn" title="Fit to View">Fit</button>
                            </div>
                        </div>
                    </div>
                    <div id="pcbToolbar" class="pcb-toolbar hidden" aria-label="PCB tools">
                        <div class="pcb-tool-group" role="group" aria-label="PCB interaction tools">
                            <button id="pcbPanToolBtn" class="pcb-tool-chip active" type="button" title="Pan board (H)" data-shortcut="H">Pan</button>
                            <button id="pcbSelectToolBtn" class="pcb-tool-chip" type="button" title="Select and move components (S)" data-shortcut="S">Select</button>
                            <button id="pcbRouteToolBtn" class="pcb-tool-chip" type="button" title="Route traces (X)" data-shortcut="X">Route</button>
                            <button id="pcbViaToolBtn" class="pcb-tool-chip" type="button" title="Place vias (V)" data-shortcut="V">Via</button>
                            <button id="pcbOutlineToolBtn" class="pcb-tool-chip" type="button" title="Draw board outline (O)" data-shortcut="O">Outline</button>
                        </div>
                        <div class="pcb-tool-group" role="group" aria-label="PCB help">
                            <button id="pcbHelpBtn" class="pcb-tool-chip" type="button" title="Keyboard shortcuts (?)" data-shortcut="?">?</button>
                        </div>
                        <div class="pcb-tool-group" role="group" aria-label="PCB routing settings">
                            <label class="pcb-tool-field" for="pcbLayerSelect">
                                <span>Layer</span>
                                <select id="pcbLayerSelect">
                                    <option value="F.Cu">F.Cu</option>
                                    <option value="B.Cu">B.Cu</option>
                                </select>
                            </label>
                            <label class="pcb-tool-field" for="pcbWidthSelect">
                                <span>Width</span>
                                <select id="pcbWidthSelect">
                                    <option value="0.2">0.20 mm</option>
                                    <option value="0.254" selected>0.254 mm</option>
                                    <option value="0.3">0.30 mm</option>
                                    <option value="0.5">0.50 mm</option>
                                    <option value="1">1.00 mm</option>
                                </select>
                            </label>
                        </div>
                    </div>
                </div>
                
                <div class="canvas-viewport">
                    <div id="canvasContainer"></div>
                    <canvas id="pcbCanvas" style="display:none"></canvas>
                    <canvas id="symbolCanvas" style="display:none"></canvas>
                    <div id="tscircuit-container" style="display:none;width:100%;height:100%"></div>
                    <div id="modeIndicator" class="mode-indicator hidden">SCHEMATIC</div>
                    <div id="completenessBadge" class="completeness-badge hidden"></div>
                    
                    <!-- PCB Upload Overlay (hidden by default, shown in PCB View tab) -->
                    <div id="pcbUploadArea" class="pcb-upload-overlay hidden">
                        <div class="pcb-upload-content">
                            <div class="pcb-upload-icon">📋</div>
                            <p>Drop a <code>.kicad_pcb</code> file here</p>
                            <p class="pcb-upload-sub">or click to browse</p>
                            <input type="file" id="pcbFileInput" accept=".kicad_pcb" hidden>
                        </div>
                    </div>

                    <!-- Contextual Route Input (Floating at bottom of canvas) -->
                    <div class="floating-route-input">
                        <input type="text" id="routePrompt" placeholder="Routing constraints (e.g. 'connect VCC to 3.3V')..." autocomplete="off">
                    </div>
                </div>

                <footer class="eda-status-bar">
                    <div class="status-left">
                        <span class="status-item">Grid: 1.27mm</span>
                        <span class="status-item" id="coordDisplay">X: 0.00 Y: 0.00</span>
                    </div>
                    <div class="status-right">
                    </div>
                </footer>
            </main>

            <div class="resize-handle" id="rightResize"></div>
            <div class="collapse-strip right-expand" id="rightExpand" style="display:none" title="Expand right panel">
                <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                    <polyline points="9,3 5,7 9,11"/>
                </svg>
            </div>

            <!-- Right Sidebar: AI Design Co-Pilot -->
            <aside class="eda-sidebar right-panel" id="rightPanel">
                <button class="sidebar-toggle right-toggle" id="rightToggle" title="Collapse panel">
                    <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                        <polyline points="4,2 8,6 4,10"/>
                    </svg>
                </button>
                <div class="panel-section agent-section">
                    <div class="panel-header">
                        <span class="panel-title">AI Design Co-Pilot</span>
                    </div>
                    <div class="agent-workspace">
                        <!-- Thinking bar — thin line indicator -->
                        <div class="agent-thinking-bar" id="agentThinkingBar"></div>
                        <!-- Compact status bar -->
                        <div class="agent-status-bar">
                            <span class="agent-status-text" id="agentStatus">Ready</span>
                        </div>
                        <!-- Activity stream -->
                        <div class="agent-conversation" id="agentConversation">
                            <div class="conv-empty" id="convEmpty">
                                <div class="empty-icon">
                                    <svg width="44" height="44" viewBox="0 0 44 44" fill="none">
                                        <rect x="6" y="6" width="32" height="32" rx="4" stroke="var(--green)" stroke-width="1.2" opacity="0.35"/>
                                        <circle cx="22" cy="22" r="5" stroke="var(--green)" stroke-width="1.2" opacity="0.45"/>
                                        <circle cx="22" cy="22" r="1.5" fill="var(--green)" opacity="0.5"/>
                                        <line x1="14" y1="2" x2="14" y2="6" stroke="var(--green)" stroke-width="1.2" opacity="0.2" stroke-linecap="round"/>
                                        <line x1="22" y1="2" x2="22" y2="6" stroke="var(--green)" stroke-width="1.2" opacity="0.2" stroke-linecap="round"/>
                                        <line x1="30" y1="2" x2="30" y2="6" stroke="var(--green)" stroke-width="1.2" opacity="0.2" stroke-linecap="round"/>
                                        <line x1="14" y1="42" x2="14" y2="38" stroke="var(--green)" stroke-width="1.2" opacity="0.2" stroke-linecap="round"/>
                                        <line x1="22" y1="42" x2="22" y2="38" stroke="var(--green)" stroke-width="1.2" opacity="0.2" stroke-linecap="round"/>
                                        <line x1="30" y1="42" x2="30" y2="38" stroke="var(--green)" stroke-width="1.2" opacity="0.2" stroke-linecap="round"/>
                                        <line x1="2" y1="14" x2="6" y2="14" stroke="var(--green)" stroke-width="1.2" opacity="0.2" stroke-linecap="round"/>
                                        <line x1="2" y1="22" x2="6" y2="22" stroke="var(--green)" stroke-width="1.2" opacity="0.2" stroke-linecap="round"/>
                                        <line x1="2" y1="30" x2="6" y2="30" stroke="var(--green)" stroke-width="1.2" opacity="0.2" stroke-linecap="round"/>
                                        <line x1="42" y1="14" x2="38" y2="14" stroke="var(--green)" stroke-width="1.2" opacity="0.2" stroke-linecap="round"/>
                                        <line x1="42" y1="22" x2="38" y2="22" stroke="var(--green)" stroke-width="1.2" opacity="0.2" stroke-linecap="round"/>
                                        <line x1="42" y1="30" x2="38" y2="30" stroke="var(--green)" stroke-width="1.2" opacity="0.2" stroke-linecap="round"/>
                                    </svg>
                                </div>
                                <div class="empty-title">Describe a circuit</div>
                                <div class="empty-sub">I'll design the schematic and PCB layout for you.</div>
                                <div class="suggestion-chips" id="suggestionChips">
                                    <button class="suggestion-chip" data-prompt="Design a 3.3V USB power supply with LED indicator">3.3V USB power supply</button>
                                    <button class="suggestion-chip" data-prompt="ESP32 with button and status LED">ESP32 with button & LED</button>
                                    <button class="suggestion-chip" data-prompt="Temperature sensor with ADC and display">Temperature sensor</button>
                                    <button class="suggestion-chip" data-prompt="Battery charger with status LED">Battery charger</button>
                                    <button class="suggestion-chip" data-prompt="Motor driver circuit with ESP32">Motor driver</button>
                                </div>
                            </div>
                        </div>
                        <!-- Command input -->
                        <div class="agent-input-group">
                            <textarea id="agentPrompt" placeholder="Describe a circuit..." rows="1"></textarea>
                            <button id="agentBtn" class="btn-send" disabled>Build</button>
                        </div>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.4.2/pixi.min.js"></script>
    <script src="/static/schematic.js?v=12"></script>
    <script src="/static/renderer_legacy.js?v=10"></script>
    <script src="/static/schematic_renderer.js?v=2"></script>
    <script src="/static/pcb_view/constants.js?v=16"></script>
    <script src="/static/pcb_view/state.js?v=16"></script>
    <script src="/static/pcb_view/utils.js?v=16"></script>
    <script src="/static/pcb_view/gl_math.js?v=16"></script>
    <script src="/static/pcb_view/kicanvas_transform.js?v=1"></script>
    <script src="/static/pcb_view/kicanvas_webgl_helpers.js?v=1"></script>
    <script src="/static/pcb_view/kicanvas_webgl_vector.js?v=1"></script>
    <script src="/static/pcb_view/kicanvas_webgl_renderer.js?v=1"></script>
    <script src="/static/pcb_view/kicanvas_board_painter.js?v=1"></script>
    <script src="/static/pcb_view/stroke-font-data.js?v=1"></script>
    <script src="/static/pcb_view/stroke-font.js?v=1"></script>
    <script src="/static/pcb_view/editor_webgl.js?v=16"></script>
    <script src="/static/pcb_view/events.js?v=16"></script>
    <script src="/static/tscircuit-bridge.js?v=1"></script>
    <script src="/static/app.js?v=13"></script>
    <!-- Toast notifications -->
    <div id="toastContainer" class="toast-container"></div>
</body>
</html>
