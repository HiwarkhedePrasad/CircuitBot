<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KiCad Schematic Editor</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h2>KiCad Component RAG</h2>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Enter component (e.g. AMS1117)" autocomplete="off">
                <button id="searchBtn">Search</button>
            </div>
            <ul id="searchResults"></ul>
            <div id="loading" class="hidden">Loading...</div>

            <div class="schematic-controls">
                <h3>Schematic</h3>
                <div class="btn-row">
                    <button id="addBtn" class="btn-add" disabled>+ Add to Schematic</button>
                    <button id="autoLayoutBtn" class="btn-layout" disabled>Auto Layout</button>
                </div>
                <div class="btn-row">
                    <button id="clearBtn" class="btn-clear" disabled>Clear All</button>
                    <button id="viewSchematicBtn" class="btn-view" disabled>View Schematic</button>
                </div>
            </div>

            <div class="component-list-section">
                <h3>Placed Components <span id="compCount">(0)</span></h3>
                <ul id="componentList"></ul>
            </div>
        </div>
        <div class="main-content">
            <div class="canvas-container">
                <canvas id="compCanvas" width="1600" height="1200"></canvas>
                <div class="zoom-controls">
                    <button id="zoomInBtn" title="Zoom In">+</button>
                    <button id="zoomOutBtn" title="Zoom Out">&#x2212;</button>
                    <button id="zoomResetBtn" title="Reset Zoom">&#x27F2;</button>
                </div>
                <div id="modeIndicator" class="mode-indicator hidden">Schematic View</div>
            </div>
            <div id="componentInfo"></div>
        </div>
    </div>
    <script src="/static/schematic.js?v=1"></script>
    <script src="/static/renderer.js?v=4"></script>
    <script src="/static/app.js?v=4"></script>
</body>
</html>
